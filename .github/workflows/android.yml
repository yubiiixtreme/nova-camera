name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK platform + build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --licenses <<< "y" > /dev/null || yes | sdkmanager --licenses > /dev/null
      - name: Build debug APKs (gms + foss)
        run: ./gradlew :app:assembleGmsDebug :app:assembleFossDebug --stacktrace
      - name: Unit tests (gms + foss)
        run: ./gradlew :app:testGmsDebugUnitTest :app:testFossDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nova-camera-debug
          path: app/build/outputs/apk/**/*.apk
